<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Decision & Alignment Agent Prototypes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2358c9c2'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Segoe UI, sans-serif' font-size='24' font-weight='800' fill='%2315212f'%3EDA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./copilot.css">
    <link rel="stylesheet" href="./screens.css">
    <link rel="stylesheet" href="./atlas.css">
    <link rel="stylesheet" href="./responsive.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to prototype</a>
    <div class="app-shell">
      <aside class="prototype-rail" aria-label="Prototype versions">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">DA</div>
          <div>
            <strong>Decision & Alignment</strong>
            <span>Hackathon prototypes</span>
          </div>
        </div>
        <nav class="version-nav" aria-label="Prototype selector">
          <button class="version-button active" data-version="copilot">
            <span>01</span>
            Copilot native
          </button>
          <button class="version-button" data-version="command">
            <span>02</span>
            Command center
          </button>
          <button class="version-button" data-version="widget">
            <span>03</span>
            MCP app widget
          </button>
        </nav>
        <div class="rail-note">
          <span>LAN ready</span>
          Static prototype with fixture-backed flows.
        </div>
      </aside>

      <main id="main" class="prototype-stage" tabindex="-1">
        <header class="stage-header">
          <div>
            <p class="eyebrow">Microsoft 365 Copilot Enterprise Agent</p>
            <h1 id="version-title">Copilot Native Flow</h1>
          </div>
          <div class="stage-actions">
            <button class="ghost-button" id="reset-flow">Reset</button>
            <button class="primary-button" id="advance-flow">Advance flow</button>
          </div>
        </header>

        <section class="flow-strip" aria-label="Demo flow steps">
          <button class="flow-step active" data-step="0">
            <span>1</span>
            Ask
          </button>
          <button class="flow-step" data-step="1">
            <span>2</span>
            Analyze
          </button>
          <button class="flow-step" data-step="2">
            <span>3</span>
            Confirm
          </button>
          <button class="flow-step" data-step="3">
            <span>4</span>
            Govern
          </button>
        </section>

        <section class="screen" id="screen" aria-live="polite"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
